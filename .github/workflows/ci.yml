name: ci

# Stages live in PrathameshMax/spendwise-ci (java-service.yml): secret scan,
# CodeQL, unit tests with a coverage gate, integration tests, dependency SBOM
# scan, SonarCloud quality gate, then Dockerfile lint, image scan, image policy,
# push, sign, attest, and the Helm chart (lint, validate, package, push, sign).
# main then promotes the signed digest dev -> sit -> uat. prod is released by
# release.yml against an approved Change Request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: PrathameshMax/spendwise-ci/.github/workflows/java-service.yml@v1
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image-name: spendwise-user-service
      # Baseline mode: coverage is measured and reported but not yet enforced.
      # Set this to the figure in the first run's summary, then only raise it.
      coverage-min: 0
    secrets:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  promote:
    needs: pipeline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: PrathameshMax/spendwise-ci/.github/workflows/promote.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      image: ${{ needs.pipeline.outputs.image }}
      digest: ${{ needs.pipeline.outputs.digest }}
